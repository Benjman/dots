# Prefix: C-Space (C-b collides with Vim's page-up)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal: true color, undercurl, OSC 52 clipboard, extended keys under kitty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:usstyle:clipboard:extkeys"
set -as terminal-features ",xterm-256color:RGB"
set -s extended-keys on
# kitty ignores xterm's modifyOtherKeys, so ask for kitty's own protocol (disambiguate
# mode) instead; otherwise kitty sends plain CR for S-Enter and tmux can't tell them apart
set -as terminal-overrides ',xterm-kitty:Eneks=\E[>1u:Dseks=\E[<u'
# ...but tmux doesn't decode that mode's Esc (CSI 27 u), so translate it back
set -s user-keys[0] "\e[27u"
bind -n User0 send-keys Escape
set -s set-clipboard on
set -g allow-passthrough on   # kitty graphics protocol (snacks.image, etc.)

# Neovim friendliness
set -sg escape-time 10
set -g focus-events on

# General
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize with prefix + HJKL (repeatable). Navigation is C-hjkl via vim-tmux-navigator.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim-tmux-navigator takes C-l, so clear the screen with prefix + C-l instead
bind C-l send-keys C-l

# Claude Code doesn't request extended keys, so S-Enter would arrive as plain Enter
# and submit; send M-Enter (its newline key) instead. Other panes get a real S-Enter.
bind -n S-Enter if -F "#{==:#{pane_current_command},claude}" "send-keys M-Enter" "send-keys S-Enter"

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# which-key-style cheat menu
bind Space display-menu -T "#[align=centre] tmux " \
  "Split right"     | "split-window -h -c '#{pane_current_path}'" \
  "Split down"      - "split-window -v -c '#{pane_current_path}'" \
  "New window"      c "new-window -c '#{pane_current_path}'" \
  "Rename window"   , "command-prompt -I '#W' { rename-window '%%' }" \
  "" \
  "Zoom pane"       z "resize-pane -Z" \
  "Kill pane"       x "kill-pane" \
  "Copy mode"       [ "copy-mode" \
  "" \
  "Sessions"        s "choose-tree -Zs" \
  "Rename session"  $ "command-prompt -I '#S' { rename-session '%%' }" \
  "Detach"          d "detach-client" \
  "" \
  "Reload config"   r "source-file -F '#{config_files}' ; display 'reloaded'"

bind r source-file -F "#{config_files}" \; display "reloaded"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# TPM lives in $XDG_DATA_HOME, not alongside this config; bootstrap on first run
run-shell 'd="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins"; tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$d/"; [ -d "$d/tpm" ] || git clone -q --depth 1 https://github.com/tmux-plugins/tpm "$d/tpm"; "$d/tpm/tpm"'
